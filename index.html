<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciné-Genesis AI</title>
<style>
:root{color-scheme:dark;--bg:#090b16;--panel:#12172a;--line:#2a3150;--accent:#9d8cff;--text:#f4f5ff;--muted:#a8afcb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2040 0,#090b16 55%);font-family:system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh}
main{max-width:850px;margin:auto;padding:28px 16px 60px}.brand{text-align:center;margin:20px 0 28px}.brand h1{margin:0;font-size:clamp(28px,7vw,44px);letter-spacing:.04em}.brand p{color:var(--muted);margin:10px 0}
.panel{background:rgba(18,23,42,.94);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 15px 45px #0003}
label{display:block;font-weight:600;margin:14px 0 8px}textarea,select{width:100%;background:#090d1d;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit}textarea{min-height:150px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:linear-gradient(120deg,#8d7aff,#b18cff);color:#101124;margin-top:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.status{color:var(--muted);font-size:14px;white-space:pre-wrap;margin-top:12px}.result img{max-width:100%;border-radius:14px;margin-top:14px}.result a{color:#c5baff;word-break:break-word}
small{color:var(--muted)}@media(max-width:520px){.row{grid-template-columns:1fr}.panel{padding:16px}}
</style>
</head>
<body>
<main>
<header class="brand"><h1>🎬 CINÉ-GENESIS AI</h1><p>Imaginez vos scènes. Créez vos images.</p></header>
<section class="panel">
<h2>Générateur d’images</h2>
<p><small>Le serveur garde votre clé API secrète. Ne la saisissez jamais dans cette page.</small></p>
<label for="prompt">Décrivez votre image</label>
<textarea id="prompt" placeholder="Exemple : Une reine égyptienne dans un temple ancien, lumière cinématographique, détails réalistes..."></textarea>
<div class="row">
<div><label for="ratio">Format</label><select id="ratio"><option value="9:16">Portrait 9:16</option><option value="16:9">Paysage 16:9</option><option value="1:1">Carré 1:1</option><option value="4:3">4:3</option><option value="3:4">3:4</option></select></div>
<div><label for="server">Serveur API</label><input id="server" value="" placeholder="Même site (par défaut)" style="width:100%;background:#090d1d;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit"></div>
</div>
<button id="generate">Générer l’image</button>
<div id="status" class="status" role="status"></div>
<div id="result" class="result"></div>
</section>
<section class="panel"><h3>État du serveur</h3><button id="check" type="button">Vérifier la connexion</button><div id="health" class="status"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function base(){return $("server").value.trim().replace(/\/+$/,"")||""}
$("check").addEventListener("click",async()=>{ $("health").textContent="Vérification…";try{const r=await fetch(base()+"/api/health");const d=await r.json();$("health").textContent=JSON.stringify(d,null,2)}catch(e){$("health").textContent="Connexion impossible. Vérifiez l’adresse du serveur et son déploiement."}});
$("generate").addEventListener("click",async()=>{
 const prompt=$("prompt").value.trim(); if(prompt.length<3){$("status").textContent="Écrivez d’abord une description de 3 caractères minimum.";return}
 $("generate").disabled=true;$("status").textContent="Demande envoyée…";$("result").replaceChildren();
 try{
  const r=await fetch(base()+"/api/generate-image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,aspect_ratio:$("ratio").value})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Erreur serveur");
  const output=d.output;let url=Array.isArray(output)?output[0]:output;
  if(url){const img=document.createElement("img");img.src=url;img.alt="Image générée";$("result").append(img);const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.textContent="Ouvrir l’image";$("result").append(a);$("status").textContent="Image générée."}
  else if(d.status==="starting"||d.status==="processing"){$("status").textContent="La génération est en cours. ID de prédiction : "+(d.id||"");}
  else {$("status").textContent="Réponse reçue : "+JSON.stringify(d)}
 }catch(e){$("status").textContent=e.message||"Erreur de génération"}
 finally{$("generate").disabled=false}
});
</script>
</body>
</html>
